[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via-ir = true
optimizer = true
optimizer_runs = 200
# Pinned: v4-core and the CCA require exactly 0.8.26, and a partial compile (forge inspect)
# under auto-detection would pick a newer solc and produce bytecode that never matches chain.
solc = "0.8.26"
ignored_warnings_from = ["lib/"]
# Upgrade scripts read build artifacts to resolve linked library addresses.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "../contracts.json" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = [
    '@openzeppelin/=lib/openzeppelin-contracts/',
    '@solady=lib/solady/src/',
    '@liquidity-launcher/=lib/liquidity-launcher/src/',
    '@continuous-clearing-auction=lib/continuous-clearing-auction/src/',
    '@uniswap/v4-core=lib/v4-core/',
    '@uniswap/v4-periphery=lib/v4-periphery/',
    '@uniswap/permit2=lib/v4-periphery/lib/permit2/',
    '@blocknumberish/=lib/continuous-clearing-auction/lib/blocknumberish/',
    'blocknumberish/=lib/continuous-clearing-auction/lib/blocknumberish/',
    '@metavest/=lib/metavest/src/',
    # CCA imports 'liquidity-launcher/src/...'. Without this, auto-detection resolves the
    # prefix to lib/liquidity-launcher/src/ and the paths double up. Same pinned commit as
    # CCA's own nested copy, so this resolves to identical sources.
    'liquidity-launcher/=lib/liquidity-launcher/',
    # Keep Universal Router's v4 path on its own pinned periphery so devnet
    # deployments use the same minHopPriceX36 ABI as public-chain routers.
    # Context-scoping leaves Umia's protocol contracts on their existing pin.
    'lib/universal-router/:@uniswap/v4-periphery/=lib/universal-router/lib/v4-periphery/',
    'permit2/=lib/v4-periphery/lib/permit2/',
    'solmate/=lib/v4-core/lib/solmate/',
    '@uniswap/v2-core/=lib/v2-core/',
    '@uniswap/v3-core/=lib/v3-core/',
    '@uniswap/v3-periphery/=lib/universal-router/lib/v3-periphery/',
    '@uniswap/universal-router/=lib/universal-router/',
]

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
exclude_lints = [
    "block-timestamp",
    "incorrect-shift",
    "divide-before-multiply",
    "unsafe-typecast",
]

[etherscan]
robinhood = { key = "${ETHERSCAN_API_KEY}", chain = 4663, url = "https://api.etherscan.io/v2/api?chainid=4663" }
monad-testnet = { key = "${ETHERSCAN_API_KEY}", chain = 10143, url = "https://api.etherscan.io/v2/api?chainid=10143" }
